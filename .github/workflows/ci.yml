name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Lower bound is the engines field; 22 and 24 are the other versions
        # eslint 10 and brace-expansion 5 support.
        node-version: ['20.19', '22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # --ignore-scripts skips the native build of isolated-vm, pulled in via
      # n8n-workflow -> @n8n/expression-runtime. It does not compile against the
      # v8 headers of Node 20.19, and nothing here uses it: n8n-workflow is only
      # needed for its types and error classes. Also keeps install scripts from
      # third-party packages out of CI.
      - run: npm ci --ignore-scripts

      - run: npm run lint

      - run: npm run build

      - run: npm test
